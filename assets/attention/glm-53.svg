<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="title desc"><title id="title">GLM-5.3: recurrence with sparse history access</title><desc id="desc">34 recurrent layers update a fixed-size matrix; 11 sparse layers retain growing state and selection metadata. The two paths occur in different layers.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 1 L7 4 L0 7" fill="none" stroke="#576969" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#fbfcf8"/><g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="42" font-size="21" fill="#228b8b" font-weight="600" text-anchor="start">GLM-5.3 / UPDATE A STATE, KEEP A RETRIEVAL PATH</text><text x="45" y="95" font-size="16" fill="#172a2a" font-weight="600" text-anchor="start">Most layers</text><rect x="45" y="112" width="101" height="52" rx="9" fill="#228b8b" fill-opacity=".09" stroke="#228b8b" stroke-width="1.5"/><text x="95.5" y="144.0" font-size="17" fill="#228b8b" font-weight="600" text-anchor="middle">token 1</text><path d="M146 138 L174 138" fill="none" stroke="#228b8b" stroke-width="2" marker-end="url(#arrow)"/><rect x="178" y="112" width="101" height="52" rx="9" fill="#228b8b" fill-opacity=".09" stroke="#228b8b" stroke-width="1.5"/><text x="228.5" y="144.0" font-size="17" fill="#228b8b" font-weight="600" text-anchor="middle">token 2</text><path d="M279 138 L307 138" fill="none" stroke="#228b8b" stroke-width="2" marker-end="url(#arrow)"/><rect x="311" y="112" width="101" height="52" rx="9" fill="#228b8b" fill-opacity=".09" stroke="#228b8b" stroke-width="1.5"/><text x="361.5" y="144.0" font-size="17" fill="#228b8b" font-weight="600" text-anchor="middle">token 3</text><path d="M412 138 L440 138" fill="none" stroke="#228b8b" stroke-width="2" marker-end="url(#arrow)"/><rect x="444" y="112" width="101" height="52" rx="9" fill="#228b8b" fill-opacity=".09" stroke="#228b8b" stroke-width="1.5"/><text x="494.5" y="144.0" font-size="17" fill="#228b8b" font-weight="600" text-anchor="middle">token 4</text><rect x="113" y="216" width="342" height="76" rx="9" fill="#228b8b" fill-opacity=".09" stroke="#228b8b" stroke-width="1.5"/><text x="284.0" y="254.0" font-size="17" fill="#228b8b" font-weight="600" text-anchor="middle">Fixed-size recurrent matrix</text><text x="284.0" y="277.0" font-size="12" fill="#228b8b" font-weight="400" text-anchor="middle">34 Kimi Delta Attention layers</text><path d="M360 166 L325 216" fill="none" stroke="#228b8b" stroke-width="2" marker-end="url(#arrow)"/><rect x="610" y="111" width="300" height="80" rx="9" fill="#7b6aa6" fill-opacity=".09" stroke="#7b6aa6" stroke-width="1.5"/><text x="760.0" y="151.0" font-size="17" fill="#7b6aa6" font-weight="600" text-anchor="middle">11 sparse-attention layers</text><text x="760.0" y="174.0" font-size="12" fill="#7b6aa6" font-weight="400" text-anchor="middle">a separate growing history</text><text x="615" y="225" font-size="16" fill="#7b6aa6" font-weight="400" text-anchor="start">Indexer → selected past entries</text><rect x="614" y="246" width="18" height="27" rx="3" fill="#7b6aa6" fill-opacity="0.32"/><rect x="638" y="246" width="18" height="27" rx="3" fill="#7b6aa6" fill-opacity="0.365"/><rect x="662" y="246" width="18" height="27" rx="3" fill="#7b6aa6" fill-opacity="0.41000000000000003"/><rect x="686" y="246" width="18" height="27" rx="3" fill="#7b6aa6" fill-opacity="0.455"/><rect x="710" y="246" width="18" height="27" rx="3" fill="#7b6aa6" fill-opacity="0.5"/><rect x="734" y="246" width="18" height="27" rx="3" fill="#7b6aa6" fill-opacity="0.5449999999999999"/><rect x="758" y="246" width="18" height="27" rx="3" fill="#7b6aa6" fill-opacity="0.5900000000000001"/><rect x="782" y="246" width="18" height="27" rx="3" fill="#7b6aa6" fill-opacity="0.635"/><rect x="806" y="246" width="18" height="27" rx="3" fill="#7b6aa6" fill-opacity="0.6799999999999999"/><rect x="830" y="246" width="18" height="27" rx="3" fill="#7b6aa6" fill-opacity="0.725"/><rect x="854" y="246" width="18" height="27" rx="3" fill="#7b6aa6" fill-opacity="0.77"/><rect x="878" y="246" width="18" height="27" rx="3" fill="#7b6aa6" fill-opacity="0.815"/><rect x="615" y="318" width="296" height="49" rx="9" fill="#7b6aa6" fill-opacity=".09" stroke="#7b6aa6" stroke-width="1.5"/><text x="763.0" y="348.5" font-size="17" fill="#7b6aa6" font-weight="600" text-anchor="middle">KV / latents + index + tail</text><text x="40" y="413" font-size="16" fill="#172a2a" font-weight="400" text-anchor="start">The recurrent matrix is bounded. The sparse layers still store history.</text></g></svg>