<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="title desc"><title id="title">DeepSeek V4.1: shared compressed KV across layers</title><desc id="desc">Four layers own long-range KV buffers. Many later layers read those buffers while retaining local windows. The consumer mapping is inferred from the checkpoint config, not directly traced.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 1 L7 4 L0 7" fill="none" stroke="#576969" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#fbfcf8"/><g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="42" font-size="22" fill="#ba6b85" font-weight="600" text-anchor="start">DEEPSEEK V4.1 / LET LAYERS SHARE HISTORY</text><rect x="52" y="110" width="268" height="78" rx="9" fill="#ba6b85" fill-opacity=".09" stroke="#ba6b85" stroke-width="1.5"/><text x="186.0" y="149.0" font-size="17" fill="#ba6b85" font-weight="600" text-anchor="middle">Four KV source layers</text><text x="186.0" y="172.0" font-size="12" fill="#ba6b85" font-weight="400" text-anchor="middle">zero-based layers 2, 8, 14, 20</text><path d="M320 149 L386 149" fill="none" stroke="#ba6b85" stroke-width="2" marker-end="url(#arrow)"/><rect x="398" y="99" width="223" height="100" rx="9" fill="#ba6b85" fill-opacity=".09" stroke="#ba6b85" stroke-width="1.5"/><text x="509.5" y="149.0" font-size="17" fill="#ba6b85" font-weight="600" text-anchor="middle">Shared KV buffers</text><text x="509.5" y="172.0" font-size="12" fill="#ba6b85" font-weight="400" text-anchor="middle">count each owner once</text><rect x="713" y="89" width="202" height="62" rx="9" fill="#5076a6" fill-opacity=".09" stroke="#5076a6" stroke-width="1.5"/><text x="814.0" y="126.0" font-size="17" fill="#5076a6" font-weight="600" text-anchor="middle">Consumer layer 1</text><path d="M621 149 L709 120" fill="none" stroke="#ba6b85" stroke-width="2" marker-end="url(#arrow)"/><rect x="713" y="187" width="202" height="62" rx="9" fill="#5076a6" fill-opacity=".09" stroke="#5076a6" stroke-width="1.5"/><text x="814.0" y="224.0" font-size="17" fill="#5076a6" font-weight="600" text-anchor="middle">Consumer layer 2</text><path d="M621 149 L709 218" fill="none" stroke="#ba6b85" stroke-width="2" marker-end="url(#arrow)"/><rect x="713" y="285" width="202" height="62" rx="9" fill="#5076a6" fill-opacity=".09" stroke="#5076a6" stroke-width="1.5"/><text x="814.0" y="322.0" font-size="17" fill="#5076a6" font-weight="600" text-anchor="middle">Consumer layer 3</text><path d="M621 149 L709 316" fill="none" stroke="#ba6b85" stroke-width="2" marker-end="url(#arrow)"/><rect x="51" y="281" width="280" height="72" rx="9" fill="#b7783d" fill-opacity=".09" stroke="#b7783d" stroke-width="1.5"/><text x="191.0" y="317.0" font-size="17" fill="#b7783d" font-weight="600" text-anchor="middle">Local windows remain</text><text x="191.0" y="340.0" font-size="12" fill="#b7783d" font-weight="400" text-anchor="middle">128 recent tokens at each layer</text><rect x="398" y="300" width="240" height="58" rx="9" fill="#7b6aa6" fill-opacity=".09" stroke="#7b6aa6" stroke-width="1.5"/><text x="518.0" y="335.0" font-size="17" fill="#7b6aa6" font-weight="600" text-anchor="middle">Indexer sources also share</text><text x="40" y="413" font-size="15" fill="#172a2a" font-weight="400" text-anchor="start">Consumer arrows summarize config references; bytes come from live-state records.</text></g></svg>