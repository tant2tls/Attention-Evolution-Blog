<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="title desc"><title id="title">An attention journey from full history to hybrid, compressed, recurrent and shared state</title><desc id="desc">Six labeled cards introduce full-history, local/global, compressed, recurrent and shared attention mechanisms.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 1 L7 4 L0 7" fill="none" stroke="#576969" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#fbfcf8"/><g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="45" font-size="24" fill="#3e7057" font-weight="600" text-anchor="start">THE ATTENTION JOURNEY</text><text x="40" y="77" font-size="17" fill="#172a2a" font-weight="400" text-anchor="start">Six deployments. Several ways to carry the past forward.</text><rect x="40" y="111" width="245" height="99" rx="9" fill="#5076a6" fill-opacity=".09" stroke="#5076a6" stroke-width="1.5"/><text x="162.5" y="160.5" font-size="17" fill="#5076a6" font-weight="600" text-anchor="middle">Llama</text><text x="162.5" y="183.5" font-size="12" fill="#5076a6" font-weight="400" text-anchor="middle">Keep every token</text><rect x="350" y="111" width="245" height="99" rx="9" fill="#b7783d" fill-opacity=".09" stroke="#b7783d" stroke-width="1.5"/><text x="472.5" y="160.5" font-size="17" fill="#b7783d" font-weight="600" text-anchor="middle">MiMo</text><text x="472.5" y="183.5" font-size="12" fill="#b7783d" font-weight="400" text-anchor="middle">Keep nearby + global</text><rect x="660" y="111" width="245" height="99" rx="9" fill="#7b6aa6" fill-opacity=".09" stroke="#7b6aa6" stroke-width="1.5"/><text x="782.5" y="160.5" font-size="17" fill="#7b6aa6" font-weight="600" text-anchor="middle">DeepSeek V4</text><text x="782.5" y="183.5" font-size="12" fill="#7b6aa6" font-weight="400" text-anchor="middle">Compress + select</text><rect x="40" y="280" width="245" height="99" rx="9" fill="#228b8b" fill-opacity=".09" stroke="#228b8b" stroke-width="1.5"/><text x="162.5" y="329.5" font-size="17" fill="#228b8b" font-weight="600" text-anchor="middle">Qwen</text><text x="162.5" y="352.5" font-size="12" fill="#228b8b" font-weight="400" text-anchor="middle">Recur + retrieve</text><rect x="350" y="280" width="245" height="99" rx="9" fill="#228b8b" fill-opacity=".09" stroke="#228b8b" stroke-width="1.5"/><text x="472.5" y="329.5" font-size="17" fill="#228b8b" font-weight="600" text-anchor="middle">GLM</text><text x="472.5" y="352.5" font-size="12" fill="#228b8b" font-weight="400" text-anchor="middle">Recur + sparse latents</text><rect x="660" y="280" width="245" height="99" rx="9" fill="#ba6b85" fill-opacity=".09" stroke="#ba6b85" stroke-width="1.5"/><text x="782.5" y="329.5" font-size="17" fill="#ba6b85" font-weight="600" text-anchor="middle">DeepSeek V4.1</text><text x="782.5" y="352.5" font-size="12" fill="#ba6b85" font-weight="400" text-anchor="middle">Share between layers</text></g></svg>