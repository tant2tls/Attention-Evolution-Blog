<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="title desc"><title id="title">DeepSeek V4: compressed history and sparse retrieval</title><desc id="desc">Two window-only layers, 21 layers with fourfold compression and an indexer, and 20 with 128-fold compression. Recent-window access is retained.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 1 L7 4 L0 7" fill="none" stroke="#576969" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#fbfcf8"/><g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="42" font-size="22" fill="#5076a6" font-weight="600" text-anchor="start">DEEPSEEK V4 / COMPRESS BEFORE LOOKING BACK</text><text x="48" y="98" font-size="16" fill="#172a2a" font-weight="600" text-anchor="start">Past tokens</text><rect x="48" y="115" width="18" height="27" rx="3" fill="#5076a6" fill-opacity="0.32"/><rect x="72" y="115" width="18" height="27" rx="3" fill="#5076a6" fill-opacity="0.365"/><rect x="96" y="115" width="18" height="27" rx="3" fill="#5076a6" fill-opacity="0.41000000000000003"/><rect x="120" y="115" width="18" height="27" rx="3" fill="#5076a6" fill-opacity="0.455"/><rect x="144" y="115" width="18" height="27" rx="3" fill="#5076a6" fill-opacity="0.5"/><rect x="168" y="115" width="18" height="27" rx="3" fill="#5076a6" fill-opacity="0.5449999999999999"/><rect x="192" y="115" width="18" height="27" rx="3" fill="#5076a6" fill-opacity="0.5900000000000001"/><rect x="216" y="115" width="18" height="27" rx="3" fill="#5076a6" fill-opacity="0.635"/><rect x="240" y="115" width="18" height="27" rx="3" fill="#5076a6" fill-opacity="0.6799999999999999"/><rect x="264" y="115" width="18" height="27" rx="3" fill="#5076a6" fill-opacity="0.725"/><rect x="288" y="115" width="18" height="27" rx="3" fill="#5076a6" fill-opacity="0.77"/><rect x="312" y="115" width="18" height="27" rx="3" fill="#5076a6" fill-opacity="0.815"/><path d="M186 153 L186 192" fill="none" stroke="#3e7057" stroke-width="2" marker-end="url(#arrow)"/><rect x="49" y="202" width="275" height="66" rx="9" fill="#5076a6" fill-opacity=".09" stroke="#5076a6" stroke-width="1.5"/><text x="186.5" y="235.0" font-size="17" fill="#5076a6" font-weight="600" text-anchor="middle">Compress the history</text><text x="186.5" y="258.0" font-size="12" fill="#5076a6" font-weight="400" text-anchor="middle">4× or 128×, depending on layer</text><path d="M324 234 L382 234" fill="none" stroke="#3e7057" stroke-width="2" marker-end="url(#arrow)"/><rect x="393" y="200" width="238" height="70" rx="9" fill="#5076a6" fill-opacity=".09" stroke="#5076a6" stroke-width="1.5"/><text x="512.0" y="235.0" font-size="17" fill="#5076a6" font-weight="600" text-anchor="middle">Compressed KV</text><text x="512.0" y="258.0" font-size="12" fill="#5076a6" font-weight="400" text-anchor="middle">fewer long-range entries</text><rect x="395" y="97" width="234" height="61" rx="9" fill="#7b6aa6" fill-opacity=".09" stroke="#7b6aa6" stroke-width="1.5"/><text x="512.0" y="133.5" font-size="17" fill="#7b6aa6" font-weight="600" text-anchor="middle">Index the 4× path</text><path d="M512 158 L512 200" fill="none" stroke="#7b6aa6" stroke-width="2" marker-end="url(#arrow)"/><path d="M631 235 L679 235" fill="none" stroke="#3e7057" stroke-width="2" marker-end="url(#arrow)"/><rect x="690" y="199" width="218" height="73" rx="9" fill="#3e7057" fill-opacity=".09" stroke="#3e7057" stroke-width="1.5"/><text x="799.0" y="235.5" font-size="17" fill="#3e7057" font-weight="600" text-anchor="middle">Attention</text><text x="799.0" y="258.5" font-size="12" fill="#3e7057" font-weight="400" text-anchor="middle">compressed history</text><rect x="48" y="308" width="275" height="63" rx="9" fill="#b7783d" fill-opacity=".09" stroke="#b7783d" stroke-width="1.5"/><text x="185.5" y="345.5" font-size="17" fill="#b7783d" font-weight="600" text-anchor="middle">Recent 128-token window</text><path d="M323 340 L801 290" fill="none" stroke="#b7783d" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="413" font-size="16" fill="#172a2a" font-weight="400" text-anchor="start">Smaller history still needs compression, selection and temporary state.</text></g></svg>